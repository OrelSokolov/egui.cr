# crosspack — build orchestration for egui-cr.
#
#   crosspack deps              # verify/install this host's build deps
#   crosspack build             # specs + all examples -> builds/
#   crosspack resolve <target>  # runtime Depends line for a target
#
# The version follows shard.yml — bump both together.

name: egui-cr
version: 0.1.0

build:
  output: builds

  # Host-axis build dependencies: what the build machine needs.
  # Host selectors: distro id from /etc/os-release, then ID_LIKE tokens
  # (ubuntu hits the debian rule), then os, then "*".
  deps:
    crystal:
      hosts:
        debian:
          verify: crystal --version
          install: curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        fedora:
          verify: crystal --version
          install: sudo dnf install -y crystal
        arch:
          verify: crystal --version
          install: sudo pacman -S --needed crystal
        "*":
          verify: crystal --version

    c-toolchain:
      hosts:
        windows:               # cl.exe via vcvars64 — see Rakefile#msvc
          verify: cmd /c ""C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | findstr /r .*"
          install: winget install --id Microsoft.VisualStudio.2022.BuildTools --override "--quiet --wait --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
        debian:
          verify: cc --version
          install: sudo apt-get install -y build-essential
        fedora:
          verify: cc --version
          install: sudo dnf groupinstall -y "Development Tools"
        arch:
          verify: cc --version
          install: sudo pacman -S --needed base-devel
        "*":
          verify: cc --version

    gl-dev:
      hosts:
        windows:               # opengl32.lib ships with the Windows SDK (c-toolchain)
          verify: cmd /c exit /b 0
        debian:
          verify: pkg-config --exists gl
          install: sudo apt-get install -y libgl1-mesa-dev
        fedora:
          verify: pkg-config --exists gl
          install: sudo dnf install -y mesa-libGL-devel
        arch:
          verify: pkg-config --exists gl
          install: sudo pacman -S --needed mesa
        "*":
          verify: pkg-config --exists gl

    x11-dev:
      hosts:
        windows:               # no X11 on Windows — sokol_app uses Win32/WGL
          verify: cmd /c exit /b 0
        debian:
          verify: pkg-config --exists x11
          install: sudo apt-get install -y libx11-dev
        fedora:
          verify: pkg-config --exists x11
          install: sudo dnf install -y libX11-devel
        arch:
          verify: pkg-config --exists x11
          install: sudo pacman -S --needed libx11
        "*":
          verify: pkg-config --exists x11

    xcursor-dev:
      hosts:
        windows:               # cursors come from Win32 IDC_* stock cursors
          verify: cmd /c exit /b 0
        debian:
          verify: pkg-config --exists xcursor
          install: sudo apt-get install -y libxcursor-dev
        fedora:
          verify: pkg-config --exists xcursor
          install: sudo dnf install -y libXcursor-devel
        arch:
          verify: pkg-config --exists xcursor
          install: sudo pacman -S --needed libxcursor
        "*":
          verify: pkg-config --exists xcursor

    xi-dev:
      hosts:
        windows:               # raw Win32 input via sokol_app
          verify: cmd /c exit /b 0
        debian:
          verify: pkg-config --exists xi
          install: sudo apt-get install -y libxi-dev
        fedora:
          verify: pkg-config --exists xi
          install: sudo dnf install -y libXi-devel
        arch:
          verify: pkg-config --exists xi
          install: sudo pacman -S --needed libxi
        "*":
          verify: pkg-config --exists xi

    freetype-dev:           # primary font backend (backend/freetype.cr)
      hosts:
        windows:               # fetched from ubawurinna/freetype-windows-binaries
          verify: cmd /c if not exist lib\freetype.lib exit 1 & if not exist bin\freetype.dll exit 1
          install: scripts\fetch_freetype.bat
        debian:
          verify: pkg-config --exists freetype2
          install: sudo apt-get install -y libfreetype-dev
        fedora:
          verify: pkg-config --exists freetype2
          install: sudo dnf install -y freetype-devel
        arch:
          verify: pkg-config --exists freetype2
          install: sudo pacman -S --needed freetype2
        "*":
          verify: pkg-config --exists freetype2

  matrix:
    - id: linux
      build: linux/amd64
      steps:
        - crystal spec          # specs must pass — same gate as CI
        - rake build:native     # vendor C -> lib/libegui_cr_sokol.a
        - rake build:examples   # bin/hello, bin/widgets_gallery
      artifacts:
        from: bin
        include: ["*"]
        to: [debian-12, ubuntu-22.04, ubuntu-24.04, ubuntu-25.10, fedora-41, arch]

    # windows-11.0 is crosspack's fixed Windows host target (version is
    # nominal — every mingw/mswin Ruby reports windows-11.0).
    - id: windows
      build: windows/amd64
      steps:
        - crystal spec          # specs must pass — same gate as CI
        - rake build:native     # vendor C (cl.exe) -> lib/egui_cr_sokol.lib
        - rake build:examples   # bin/hello.exe, bin/widgets_gallery.exe
      artifacts:
        from: bin
        include: ["*.exe", "*.dll"]   # Crystal drops gc.dll/iconv-2.dll next to exes
        to: [windows-11.0]
        mode: copy              # symlinks need dev-mode/admin on Windows

# Packing: egui-cr ships a demo application (widgets_gallery), so unlike
# a pure library shard it does carry a package: section. `crosspack run`
# builds for this host and launches the first executable from builds/.
package:
  maintainer: egui-cr developers
  summary: egui-cr demo — immediate-mode GUI for Crystal over sokol_gfx
  description: |-
    egui-cr demo application: a 1:1 Crystal port of the egui (Rust)
    immediate-mode GUI architecture, rendered through sokol_gfx with a
    Crystal-native text stack (FreeType-hinted glyphs, stb light-hint
    fallback).
    The widgets_gallery example shows every widget
    (buttons, checkboxes, sliders, combos, text edits, menus, modals)
    laid out on the panel system with a scrollable widget list.
  sources: builds
  prefix: usr/local
  payload:
    # Windows binaries carry .exe — the common key stays extension-less
    # and resolves to the real file name per target (executables and
    # links below reference the key, not the file).
    widgets_gallery:
      windows: widgets_gallery.exe
      "*": widgets_gallery
  executables:
    - widgets_gallery
  links:
    bin/widgets_gallery: ../lib/egui-cr/widgets_gallery

# Runtime-axis dependencies: native libraries an egui-cr application
# links at run time, per distro family. Linux only for now.
deps:
  version: 1
  libgl:
    targets:
      debian: { "*": [libgl1] }
      ubuntu: { "*": [libgl1] }
      fedora: { "*": [libgl] }
      arch: { "*": [libglvnd] }
      windows: system           # opengl32.dll ships with the OS
  libx11:
    targets:
      debian: { "*": [libx11-6] }
      ubuntu: { "*": [libx11-6] }
      fedora: { "*": [libX11] }
      arch: { "*": [libx11] }
      windows: none             # sokol_app uses Win32/WGL there
  libxcursor:              # not in crosspack's canonical list — resolves fine
    targets:
      debian: { "*": [libxcursor1] }
      ubuntu: { "*": [libxcursor1] }
      fedora: { "*": [libXcursor] }
      arch: { "*": [libxcursor] }
      windows: none             # Win32 IDC_* stock cursors
  libxi:                   # not in crosspack's canonical list — resolves fine
    targets:
      debian: { "*": [libxi6] }
      ubuntu: { "*": [libxi6] }
      fedora: { "*": [libXi] }
      arch: { "*": [libxi] }
      windows: none             # raw Win32 input via sokol_app
  libfreetype:             # primary font backend
    targets:
      debian: { "*": [libfreetype6] }
      ubuntu: { "*": [libfreetype6] }
      fedora: { "*": [freetype] }
      arch: { "*": [freetype2] }
      windows: bundled          # bin\freetype.dll ships next to the exes
  vc-redist:               # the FreeType DLL needs the VC++ v14 runtime
    targets:
      windows:
        "*": [Microsoft.VCRedist.2015+.x64]
      debian: none              # the Linux build does not use MSVC binaries
      ubuntu: none
      fedora: none
      arch: none
