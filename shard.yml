name: egui-cr
version: 0.5.2
description: |
  Immediate-mode GUI for Crystal — a 1:1 port of the egui (Rust)
  architecture: Context / Ui / Memory / Response / widgets, rendered
  through sokol_gfx (sokol_app + sokol_gl + fontstash).

  Reference clone: egui-upstream/ (read-only). Native vendor code:
  vendor/sokol, vendor/fontstash.

# SPDX: the open-source leg of the dual license; the commercial
# alternative is described in LICENSE and the README.
license: AGPL-3.0

dependencies:
  nanosvg:
    github: OrelSokolov/nanosvg.cr
  # Pure-Crystal Lottie player — a twin of rlottie's evaluation model
  # (verified against its render-tree dumps). The default backend for
  # `ui.lottie` (backend/lottie_cr.cr); the rlottie C shim remains in
  # the tree as the dev A/B reference.
  lottie:
    github: OrelSokolov/lottie.cr
  # The Crystal port of FreeType (rasterizer + TrueType bytecode hinter)
  # — the release font backend (backend/crystalfonts.cr). Pure Crystal:
  # no libfreetype dependency in shipped binaries.
  freetype-cr:
    github: OrelSokolov/freetype.cr
    version: 1.1.0
  # Синтаксическая подсветка fenced-code в markdown-виджете (порт
  # highlight.js 11.12.0).
  highlight_cr:
    github: OrelSokolov/highlight.cr
  # Звук SystemPorts::Audio: vendored miniaudio за идиоматичным API
  # (Engine/Sound/Decoder). Нужен только приложениям, которые требуют
  # "egui/driver/audio". https-шорткат (как у остальных): git@ SSH-URL
  # в shard.lock ломает `shards install` на машинах без ключа — CI-раннеры
  # kodkod падали на клоне.
  minaudio:
    github: OrelSokolov/minaudio.cr

# Demos only (examples/ + spec/) — never pulled in when egui-cr is
# used as a library. examples/system_monitor.cr reads RAM, CPU and
# network through it.
development_dependencies:
  sysinfo:
    github: OrelSokolov/sysinfo.cr
  # Demos only: examples/formulas.cr typesets TeX through the MathJax
  # core port and renders the SVG output via NanoSVG.
  mathjax:
    git: https://github.com/OrelSokolov/mathjax.cr
    # >= 1.1.0: to_svg(paths: true) — v3 defs+use SVG for examples/formulas
    version: ">= 1.1.0"

# carat delivery contract: binaries this shard ships (a subset of the
# Rakefile EXAMPLES list; `lottie` is behind LOTTIE=1 and not listed).
# Keys carry the bin/ class prefix (apps/, html/, clones/) — the same
# subdirectory each rake build drops the binary into. `all:` carries
# the shared spec — the native prebuild (runs ONCE per section, before
# any binary is built) and the per-OS link flags; entries only
# override main:.
binaries:
  all:
    prebuild: rake build:native
    link_flags:
      "*": [-Llib]
      linux: [lib/libegui_cr_sokol.a, -Llib, -Llib/minaudio/lib]
      darwin: [-framework Cocoa, -framework OpenGL, -framework QuartzCore, -framework AVFoundation, -framework CoreMedia, -framework IOKit]
      windows: [/LIBPATH:lib]

  apps/hello:               {main: examples/hello.cr}
  apps/widgets_gallery:     {main: examples/widgets_gallery.cr}
  apps/openfiledialog:      {main: examples/openfiledialog.cr}
  apps/fontpreview:         {main: examples/fontpreview.cr}
  apps/fontbrowser:         {main: examples/fontbrowser.cr}
  apps/logos:               {main: examples/logos.cr}
  apps/counter_reactive:    {main: examples/counter_reactive.cr}
  apps/chat:                {main: examples/chat.cr}
  apps/notepad:             {main: examples/notepad.cr}
  apps/notepad_with_exml:   {main: examples/notepad_with_exml.cr}
  apps/borderless:          {main: examples/borderless.cr}
  apps/splash:              {main: examples/splash.cr}
  apps/terminal:            {main: examples/terminal.cr}
  apps/win_properties_demo: {main: examples/win_properties_demo.cr}
  html/box_shadow:          {main: examples/box_shadow.cr}
  apps/video:               {main: examples/video.cr}
  apps/inspector_demo:      {main: examples/inspector_demo.cr}
  apps/icons_browser:       {main: examples/icons_browser.cr}
  apps/svg_rasterizer:      {main: examples/svg_rasterizer.cr}
  apps/paint:               {main: examples/paint.cr}
  apps/system_monitor:      {main: examples/system_monitor.cr}
  apps/markdown:            {main: examples/markdown.cr}
  apps/mdvsfonts:           {main: examples/mdvsfonts.cr}
  apps/formulas:            {main: examples/formulas.cr}
  apps/crystal3d:           {main: examples/crystal3d.cr}
  apps/rounded_window:      {main: examples/rounded_window.cr}
  apps/tableview:           {main: examples/tableview.cr}
  apps/text_input:          {main: examples/text_input.cr}
  apps/ios_demo:            {main: examples/ios_demo.cr}
  apps/multitouch_demo:     {main: examples/multitouch_demo.cr}
  apps/responsive_demo:     {main: examples/responsive_demo.cr}
  apps/camera:              {main: examples/camera.cr}
  apps/device_api:          {main: examples/device_api.cr}
  apps/audio:               {main: examples/audio.cr}
  apps/remote_image:        {main: examples/remote_image.cr}
  apps/tray:                {main: examples/tray.cr}
  apps/voice_echo:          {main: examples/voice_echo.cr}

  # The Vue SFC port tool (plans/vue2velvet.md) — template+style →
  # .exml/.ecss, the script half is a report for the Crystal
  # Component. Text-only tool: needs no windowing, but the shared
  # `all:` prebuild/link flags apply per the carat contract.
  apps/vue2velvet:          {main: tools/vue2velvet.cr}
