name: egui-cr
version: 0.5.0
description: |
  Immediate-mode GUI for Crystal — a 1:1 port of the egui (Rust)
  architecture: Context / Ui / Memory / Response / widgets, rendered
  through sokol_gfx (sokol_app + sokol_gl + fontstash).

  Reference clone: egui-upstream/ (read-only). Native vendor code:
  vendor/sokol, vendor/fontstash.

# SPDX: the open-source leg of the dual license; the commercial
# alternative is described in LICENSE and the README.
license: AGPL-3.0

dependencies:
  nanosvg:
    github: OrelSokolov/nanosvg.cr
  # The Crystal port of FreeType (rasterizer + TrueType bytecode hinter)
  # — the release font backend (backend/crystalfonts.cr). Pure Crystal:
  # no libfreetype dependency in shipped binaries.
  freetype-cr:
    github: OrelSokolov/freetype.cr
    version: 1.1.0
  # Синтаксическая подсветка fenced-code в markdown-виджете (порт
  # highlight.js 11.12.0).
  highlight_cr:
    github: OrelSokolov/highlight.cr
  # Звук SystemPorts::Audio: vendored miniaudio за идиоматичным API
  # (Engine/Sound/Decoder). Нужен только приложениям, которые требуют
  # "egui/backend/audio".
  minaudio:
    git: git@github.com:OrelSokolov/minaudio.cr.git

# Demos only (examples/ + spec/) — never pulled in when egui-cr is
# used as a library. examples/system_monitor.cr reads RAM, CPU and
# network through it.
development_dependencies:
  sysinfo:
    github: OrelSokolov/sysinfo.cr
  # Demos only: examples/formulas.cr typesets TeX through the MathJax
  # core port and renders the SVG output via NanoSVG.
  mathjax:
    git: https://github.com/OrelSokolov/mathjax.cr
    # >= 1.1.0: to_svg(paths: true) — v3 defs+use SVG for examples/formulas
    version: ">= 1.1.0"

# carat delivery contract: binaries this shard ships (the Rakefile EXAMPLES
# list; `lottie` is behind LOTTIE=1 and not listed). `all:` carries the
# shared spec — the native prebuild (runs ONCE per section, before any
# binary is built) and the per-OS link flags; entries only override main:.
binaries:
  all:
    prebuild: rake build:native
    link_flags:
      "*": [-Llib]
      linux: [lib/libegui_cr_sokol.a, -Llib, -Llib/minaudio/lib]
      darwin: [-framework Cocoa, -framework OpenGL, -framework QuartzCore, -framework AVFoundation, -framework CoreMedia, -framework IOKit]
      windows: [/LIBPATH:lib]

  hello:               {main: examples/hello.cr}
  widgets_gallery:     {main: examples/widgets_gallery.cr}
  openfiledialog:      {main: examples/openfiledialog.cr}
  fontpreview:         {main: examples/fontpreview.cr}
  fontbrowser:         {main: examples/fontbrowser.cr}
  logos:               {main: examples/logos.cr}
  counter_reactive:    {main: examples/counter_reactive.cr}
  notepad:             {main: examples/notepad.cr}
  notepad_with_exml:   {main: examples/notepad_with_exml.cr}
  borderless:          {main: examples/borderless.cr}
  splash:              {main: examples/splash.cr}
  terminal:            {main: examples/terminal.cr}
  win_properties_demo: {main: examples/win_properties_demo.cr}
  box_shadow:          {main: examples/box_shadow.cr}
  video:               {main: examples/video.cr}
  inspector_demo:      {main: examples/inspector_demo.cr}
  icons_browser:       {main: examples/icons_browser.cr}
  svg_rasterizer:      {main: examples/svg_rasterizer.cr}
  paint:               {main: examples/paint.cr}
  system_monitor:      {main: examples/system_monitor.cr}
  markdown:            {main: examples/markdown.cr}
  mdvsfonts:           {main: examples/mdvsfonts.cr}
  formulas:            {main: examples/formulas.cr}
  crystal3d:           {main: examples/crystal3d.cr}
  rounded_window:      {main: examples/rounded_window.cr}
  tableview:           {main: examples/tableview.cr}
  text_input:          {main: examples/text_input.cr}
  ios_demo:            {main: examples/ios_demo.cr}
  multitouch_demo:     {main: examples/multitouch_demo.cr}
  responsive_demo:     {main: examples/responsive_demo.cr}
  camera:              {main: examples/camera.cr}
  device_api:          {main: examples/device_api.cr}
  audio:               {main: examples/audio.cr}
  remote_image:        {main: examples/remote_image.cr}
  tray:                {main: examples/tray.cr}
  voice_echo:          {main: examples/voice_echo.cr}
